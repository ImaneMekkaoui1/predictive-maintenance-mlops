
name: CD - Deploy to Oracle Cloud

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "CI/CD - Predictive Maintenance"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: oracle-master-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy FastAPI to Oracle
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application on Oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Vérifier que le SHA contient 40 caractères hexadécimaux
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1

          echo "Déploiement du commit : $DEPLOY_SHA"

          # Transmettre le SHA au script Oracle par SSH
          printf '%s\n' "$DEPLOY_SHA" | ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" \
            'sudo -n /opt/predictive-maintenance/deploy.sh'
