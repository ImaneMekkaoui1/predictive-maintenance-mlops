
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus lui-même
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # API FastAPI locale sur MacBook
  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # API FastAPI déployée sur Oracle Cloud
  - job_name: "oracle-fastapi"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:18001"]
